<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="700" rx="16" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1199" height="699" rx="16" fill="none" stroke="#E2E8F0"/>

  <text x="40" y="52" font-size="24" font-weight="700" fill="#0F172A">Skyway ERP: System Architecture</text>
  <text x="40" y="78" font-size="14" fill="#64748B">React frontend on Supabase, with access rules and business logic enforced in PostgreSQL</text>

  <!-- FRONTEND -->
  <g filter="url(#sh)">
    <rect x="40" y="120" width="250" height="440" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  </g>
  <rect x="40" y="120" width="250" height="44" rx="12" fill="#2563EB"/>
  <rect x="40" y="148" width="250" height="16" fill="#2563EB"/>
  <text x="58" y="148" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="0.8">FRONTEND · VERCEL</text>

  <rect x="58" y="182" width="214" height="62" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="72" y="206" font-size="14" font-weight="600" fill="#0F172A">React 19 + Vite</text>
  <text x="72" y="226" font-size="12" fill="#64748B">Error boundary at app root</text>

  <rect x="58" y="256" width="214" height="62" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="72" y="280" font-size="14" font-weight="600" fill="#0F172A">Zustand + React Query</text>
  <text x="72" y="300" font-size="12" fill="#64748B">Global state, selective caching</text>

  <rect x="58" y="330" width="214" height="150" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="72" y="354" font-size="14" font-weight="600" fill="#0F172A">34 pages</text>
  <text x="72" y="378" font-size="13" fill="#334155">Quotations · LPOs</text>
  <text x="72" y="398" font-size="13" fill="#334155">Invoices · Payments</text>
  <text x="72" y="418" font-size="13" fill="#334155">Deliveries · Equipment</text>
  <text x="72" y="438" font-size="13" fill="#334155">VAT · Reports · Analytics</text>
  <text x="72" y="458" font-size="13" fill="#334155">Payables · Settings</text>

  <rect x="58" y="492" width="214" height="52" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="72" y="514" font-size="13" font-weight="600" fill="#0F172A">Print-ready reports</text>
  <text x="72" y="532" font-size="12" fill="#64748B">window.print(), no PDF library</text>

  <!-- SUPABASE -->
  <g filter="url(#sh)">
    <rect x="340" y="100" width="820" height="560" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  </g>
  <text x="362" y="130" font-size="14" font-weight="700" fill="#15803D" letter-spacing="0.8">SUPABASE</text>

  <g filter="url(#sh)">
    <rect x="362" y="190" width="190" height="140" rx="10" fill="#FFFFFF" stroke="#BBF7D0"/>
  </g>
  <rect x="362" y="190" width="6" height="140" rx="3" fill="#16A34A"/>
  <text x="382" y="217" font-size="15" font-weight="700" fill="#0F172A">Auth</text>
  <text x="382" y="240" font-size="12" fill="#475569">Sign-in and session (JWT)</text>
  <text x="382" y="260" font-size="12" fill="#475569">Role read from</text>
  <text x="382" y="278" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0F172A">profiles.role</text>
  <text x="382" y="306" font-size="11" fill="#64748B">Five roles, owner to viewer</text>

  <g filter="url(#sh)">
    <rect x="362" y="380" width="190" height="120" rx="10" fill="#FFFFFF" stroke="#BBF7D0"/>
  </g>
  <rect x="362" y="380" width="6" height="120" rx="3" fill="#16A34A"/>
  <text x="382" y="407" font-size="15" font-weight="700" fill="#0F172A">Storage</text>
  <text x="382" y="430" font-size="12" fill="#475569">1 private bucket</text>
  <text x="382" y="450" font-size="12" fill="#475569">LPO documents</text>

  <!-- POSTGRES -->
  <g filter="url(#sh)">
    <rect x="596" y="150" width="540" height="490" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  </g>
  <text x="618" y="178" font-size="14" font-weight="700" fill="#4338CA" letter-spacing="0.8">POSTGRESQL</text>

  <rect x="618" y="196" width="496" height="52" rx="8" fill="#1E1B4B"/>
  <text x="638" y="219" font-size="14" font-weight="700" fill="#FFFFFF">Row Level Security on every table</text>
  <text x="638" y="238" font-size="12" fill="#C7D2FE">Role-based policies using get_current_user_role()</text>

  <rect x="618" y="280" width="240" height="130" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="636" y="306" font-size="15" font-weight="700" fill="#0F172A">RPCs and views</text>
  <text x="636" y="330" font-size="12" fill="#475569">Server-side VAT (5%)</text>
  <text x="636" y="348" font-size="12" fill="#475569">Aging and cash-flow reports</text>
  <text x="636" y="366" font-size="12" fill="#475569">Utilization and dashboard KPIs</text>
  <text x="636" y="384" font-size="12" fill="#475569">Atomic quote → invoice conversion</text>

  <rect x="874" y="280" width="240" height="130" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="892" y="306" font-size="15" font-weight="700" fill="#0F172A">Core tables (49)</text>
  <text x="892" y="330" font-size="12" fill="#475569">Clients, quotations, invoices</text>
  <text x="892" y="348" font-size="12" fill="#475569">Payments, deliveries, rentals</text>
  <text x="892" y="366" font-size="12" fill="#475569">Equipment units, inventory</text>
  <text x="892" y="384" font-size="12" fill="#475569">Expenses, suppliers, staff</text>

  <rect x="618" y="446" width="240" height="72" rx="10" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="636" y="472" font-size="14" font-weight="700" fill="#0F172A">Audit and activity logs</text>
  <text x="636" y="492" font-size="12" fill="#475569">Audit log is append-only</text>

  <rect x="874" y="446" width="240" height="72" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-dasharray="6 4"/>
  <text x="892" y="472" font-size="14" font-weight="700" fill="#0F172A">Shadow partitions</text>
  <text x="892" y="492" font-size="12" fill="#475569">Yearly ranges, ready for cutover</text>

  <rect x="618" y="546" width="496" height="82" rx="10" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="636" y="572" font-size="14" font-weight="700" fill="#92400E">pg_cron · scheduled job</text>
  <text x="636" y="596" font-size="12" fill="#78350F">Daily at 01:00 UTC: expire overdue quotations</text>
  <text x="636" y="614" font-size="12" fill="#78350F">Other maintenance routines exist as database functions</text>

  <!-- ARROWS -->
  <path d="M290,260 L360,260" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="297" y="250" font-size="11" fill="#475569">supabase-js</text>
  <path d="M290,440 L360,440" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="298" y="430" font-size="11" fill="#475569">LPO files</text>
  <path d="M552,260 L580,260 L580,222 L616,222" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <path d="M738,248 L738,278" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <path d="M994,248 L994,278" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <path d="M858,345 L872,345" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <path d="M930,410 L930,428 L738,428 L738,444" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <path d="M1040,410 L1040,444" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arrD)"/>

  <!-- legend -->
  <line x1="40" y1="684" x2="80" y2="684" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="90" y="688" font-size="12" fill="#475569">Request / data flow</text>
  <line x1="240" y1="684" x2="280" y2="684" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrD)"/>
  <text x="290" y="688" font-size="12" fill="#475569">Planned / not yet live</text>
</svg>
